name: Stage reviewed Encore candidate without activation
on:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: community-phase-acceptance
  cancel-in-progress: false
jobs:
  operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact operation revision
        env:
          EXPECTED: ${{ inputs.expected_head }}
        run: test "$EXPECTED" = "$GITHUB_SHA"
      - name: Download immutable candidate and verify CI digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request,urllib.error
          base='https://api.github.com/repos/ThingsPanel/thingspanel-backend-community/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=30) as r:return json.load(r)
          run=api('actions/runs/43350641612')
          if run['conclusion']!='success' or run['head_sha']!='db078b3e47af72338c856d38dd676b55e20660fa':raise RuntimeError('CI-run-identity-mismatch')
          meta=api('actions/artifacts/14003966888')
          if meta['id']!=14003966888 or meta['workflow_run']['id']!=43350641612 or meta['digest']!='sha256:f8b754dd9158d8883066cc8998a5d66766f4576868a27a04a3b757c87bd432e7' or meta.get('expired'):raise RuntimeError('CI-artifact-identity-mismatch')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          try:urllib.request.build_opener(NoRedirect).open(urllib.request.Request(base+'actions/artifacts/14003966888/zip',headers=headers),timeout=30)
          except urllib.error.HTTPError as e:
              if e.code!=302:raise RuntimeError('artifact redirect unavailable') from None
              url=e.headers['Location']
          else:raise RuntimeError('artifact redirect missing')
          try:
              with urllib.request.urlopen(url,timeout=120) as r:data=r.read(100*1024*1024+1)
          except Exception:raise RuntimeError('artifact download failed') from None
          if len(data)>100*1024*1024 or hashlib.sha256(data).hexdigest()!='f8b754dd9158d8883066cc8998a5d66766f4576868a27a04a3b757c87bd432e7':raise RuntimeError('CI-artifact-size-or-digest-mismatch')
          pathlib.Path(os.environ['RUNNER_TEMP'],'q09-candidate.zip').write_bytes(data)
          PY
      - name: Stage exact candidate without activation
        env:
          DEPLOY_KEY: ${{ secrets.C_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/phase-key"
          ssh_args=(-i "$RUNNER_TEMP/phase-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/community-test/known_hosts)
          ssh "${ssh_args[@]}" root@47.92.253.145 'for p in /opt/tp-community-actions/q09-encore-db078-ci43350641612.zip /opt/tp-community-actions/q09-encore-db078-ci43350641612-bundle /opt/tp-community-actions/q09-encore-db078-ci43350641612; do test ! -e "$p" && test ! -L "$p" || exit 1; done'
          scp "${ssh_args[@]}" "$RUNNER_TEMP/q09-candidate.zip" root@47.92.253.145:/opt/tp-community-actions/q09-encore-db078-ci43350641612.zip
          ssh "${ssh_args[@]}" root@47.92.253.145 '/usr/bin/python3.11 -' < deploy/community-test/phase-operation.py > phase-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-result
          path: phase-result.json
      - name: Remove runner key
        if: always()
        run: rm -f "$RUNNER_TEMP/phase-key"
