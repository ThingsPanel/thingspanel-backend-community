name: App MQTT notification validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-main-encore-deploy
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect authorized community test deployment
        env:
          DEPLOY_KEY: ${{ secrets.C_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy-key"
          args=(-i "$RUNNER_TEMP/deploy-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/community-test/known_hosts)
          scp "${args[@]}" deploy/community-test/app_mqtt_inspect.py root@47.92.253.145:/opt/tp-community-actions/incoming/app_mqtt_inspect.py
          ssh "${args[@]}" root@47.92.253.145 'python3 /opt/tp-community-actions/incoming/app_mqtt_inspect.py' > result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-mqtt-validation
          path: result.json
          retention-days: 3
      - name: Remove runner key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-key"
