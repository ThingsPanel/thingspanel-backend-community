name: Activate reviewed Encore candidate
on:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: community-phase-acceptance
  cancel-in-progress: false
jobs:
  operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact operation revision
        env:
          EXPECTED: ${{ inputs.expected_head }}
        run: test "$EXPECTED" = "$GITHUB_SHA"
      - name: Apply exact previously staged candidate
        env:
          DEPLOY_KEY: ${{ secrets.C_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/phase-key"
          ssh_args=(-i "$RUNNER_TEMP/phase-key" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/community-test/known_hosts)
          ssh "${ssh_args[@]}" root@47.92.253.145 '/usr/bin/python3.11 -' < deploy/community-test/phase-operation.py > phase-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-result
          path: phase-result.json
      - name: Remove runner key
        if: always()
        run: rm -f "$RUNNER_TEMP/phase-key"
