name: Approved phase operation
on:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: community-phase-acceptance
  cancel-in-progress: false
jobs:
  operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the reviewed operation revision
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          ACTUAL_HEAD: ${{ github.sha }}
        run: test "$EXPECTED_HEAD" = "$ACTUAL_HEAD"
      - uses: actions/checkout@v4
      - name: Run approved phase operation
        env:
          DEPLOY_KEY: ${{ secrets.C_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/phase-key"
          ssh -i "$RUNNER_TEMP/phase-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/community-test/known_hosts root@47.92.253.145 '/usr/bin/python3.11 -' < deploy/community-test/phase-operation.py > phase-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-result
          path: phase-result.json
      - name: Remove runner key
        if: always()
        run: rm -f "$RUNNER_TEMP/phase-key"
