# Candidate-branch dispatch adapter using an already registered workflow path.
# Build and GitHub artifact upload only. No SSH, deployment or migrations.
name: Build additive Gin bounded directory candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-gin-integrated-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notification_test
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: notification_test
        ports: ['25543:5432']
        options: >-
          --health-cmd "pg_isready -U notification_test -d notification_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: true
      - name: Verify fixed source scope and compose the deployed owner
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch origin 47405bfd51eba9f436231744de9a123d4278152d
          git fetch origin c4197017533974a624a3fa0982a0f79cd6443ec7
          python3 -m unittest discover -s deploy/community-test -p test_gin_integrated_candidate.py
          python3 deploy/community-test/build_gin_integrated_candidate.py compose "$RUNNER_TEMP/gin-integrated"
      - name: Validate actual combined Gin and real PostgreSQL boundaries
        env:
          Q02_METADATA_TEST_DSN: postgres://notification_test:fixture-only-password@127.0.0.1:25543/notification_test?sslmode=disable
          TEST_AUTOMATION_DIRECTORY_DSN: postgres://notification_test:fixture-only-password@127.0.0.1:25543/notification_test?sslmode=disable
          TEST_BROKER_DATABASE_DSN: host=127.0.0.1 port=25543 user=notification_test password=fixture-only-password dbname=notification_test sslmode=disable
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gin-integrated/source/backend"
          go test ./internal/model ./internal/dal ./internal/api ./internal/service ./internal/brokersemantic ./internal/brokercontrol ./internal/adapter/mqttadapter ./router -run 'Test(DeviceConfigCondition|DeviceConfigMetadataPostgres|TemplateMetadataAPI|NativeCommand|PostgresNativeCommandOwnerValidation|ExpectedCommandRetains|ValidateCommand|CommandFingerprintSnapshotLegacyJSONIsStable|PostgresPluginPublisherAuthenticatesWhileDispatchHoldsRoute|DeviceDiagnosticsAuthenticatedTenantBoundary|HTTPCommandWireUsesAcceptedDeadlineOnly|AutomationDeviceLookup|AutomationOwnerAuth)' -count=1 -json | tee "$RUNNER_TEMP/gin-integrated/tests.jsonl"
          python3 "$GITHUB_WORKSPACE/deploy/community-test/build_gin_integrated_candidate.py" verify-tests "$RUNNER_TEMP/gin-integrated/tests.jsonl"
      - name: Retain mainline ownership and validate stage transform guards
        env:
          Q02_METADATA_TEST_DSN: postgres://notification_test:fixture-only-password@127.0.0.1:25543/notification_test?sslmode=disable
        run: |
          set -euo pipefail
          # The composed baseline, not the mainline checkout, owns stage hashes.
          # Transform guards are validated against a fresh pre-transform composition.
          python3 "$RUNNER_TEMP/gin-integrated/_baseline_checkout/deploy/community-test/mqtt_publisher_release.py" sources "$RUNNER_TEMP/gin-stage-guard"
          TEMPLATE_CAS_STAGE_SOURCE="$RUNNER_TEMP/gin-stage-guard/backend" python3 -m unittest discover -s deploy/community-test -p test_template_metadata_cas.py
          go test ./internal/dal -run '^TestDeviceConfigMetadataKeepsMainOwnerPostgres$' -count=1 -json | tee "$RUNNER_TEMP/gin-integrated/main-owner-tests.jsonl"
          python3 - <<'PY'
          import importlib.util,os,pathlib
          path=pathlib.Path('deploy/community-test/build_gin_integrated_candidate.py')
          s=importlib.util.spec_from_file_location('candidate',path);m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          m.verify_tests(pathlib.Path(os.environ['RUNNER_TEMP'])/'gin-integrated/main-owner-tests.jsonl',('TestDeviceConfigMetadataKeepsMainOwnerPostgres',))
          PY
      - name: Build the Linux Gin artifact from verified composed source
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gin-integrated/source/backend"
          go build -trimpath -buildvcs=false -ldflags "-s -w -X project/pkg/global.SYSTEM_VERSION=gin-cas-command-$GITHUB_SHA" -o "$RUNNER_TEMP/ThingsPanel-Go" .
          cd "$GITHUB_WORKSPACE"
          python3 deploy/community-test/build_gin_integrated_candidate.py package "$RUNNER_TEMP/gin-integrated" "$RUNNER_TEMP/ThingsPanel-Go" "gin-integrated-$GITHUB_SHA.tar.gz" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gin-integrated-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gin-integrated/SOURCE_PROVENANCE.json
            ${{ runner.temp }}/gin-integrated/SOURCE_FILES.json
            ${{ runner.temp }}/gin-integrated/tests.jsonl
            ${{ runner.temp }}/gin-integrated/main-owner-tests.jsonl
            ${{ runner.temp }}/gin-integrated/manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: gin-integrated-${{ github.sha }}
          path: gin-integrated-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
