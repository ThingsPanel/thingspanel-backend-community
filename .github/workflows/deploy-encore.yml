name: Approved phase operation
on:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: community-phase-acceptance
  cancel-in-progress: false
jobs:
  operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the reviewed operation revision
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          ACTUAL_HEAD: ${{ github.sha }}
        run: test "$EXPECTED_HEAD" = "$ACTUAL_HEAD"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-candidate-7e5a3afea76c27fb22b705e054a2d25ceeea0ba8
          run-id: 43040634989
          github-token: ${{ github.token }}
      - name: Run approved phase operation
        env:
          DEPLOY_KEY: ${{ secrets.C_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/phase-key"
          scp -i "$RUNNER_TEMP/phase-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/community-test/known_hosts encore-7e5a3afea76c27fb22b705e054a2d25ceeea0ba8.tar.gz root@47.92.253.145:/opt/tp-community-actions/incoming/
          ssh -i "$RUNNER_TEMP/phase-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/community-test/known_hosts root@47.92.253.145 'python3 -' < deploy/community-test/phase-operation.py > phase-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-result
          path: phase-result.json
      - name: Remove runner key
        if: always()
        run: rm -f "$RUNNER_TEMP/phase-key"
