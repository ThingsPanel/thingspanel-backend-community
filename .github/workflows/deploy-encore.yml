name: Native metadata isolated restore rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-main-encore-deploy
  cancel-in-progress: false
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preserve existing native models in a verified isolated copy
        env:
          DEPLOY_KEY: ${{ secrets.C_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/community-rehearsal-key"
          ssh -i "$RUNNER_TEMP/community-rehearsal-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/community-test/known_hosts -o ServerAliveInterval=20 -o ServerAliveCountMax=9 root@47.92.253.145 'python3 - --source native_main_20261028 --target tp_upgrade_rehearsal_20261111165830 --directory /opt/tp-community-actions/upgrade-rehearsal/native-20261111165830' < deploy/community-test/upgrade_rehearsal.py > native-restore-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-upgrade-restore-summary
          path: native-restore-summary.json
      - name: Remove runner temporary SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/community-rehearsal-key"
