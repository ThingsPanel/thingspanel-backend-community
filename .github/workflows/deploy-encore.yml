name: Read-only conversion progress
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-upgrade-readonly
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect isolated source semantics only
        env:
          DEPLOY_KEY: ${{ secrets.C_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/community-profile-key"
          ssh -i "$RUNNER_TEMP/community-profile-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/community-test/known_hosts root@47.92.253.145 'python3 -' < deploy/community-test/inspect_conversion_progress.py > conversion-progress.json
      - uses: actions/upload-artifact@v4
        with:
          name: conversion-progress
          path: conversion-progress.json
      - name: Remove runner temporary SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/community-profile-key"
