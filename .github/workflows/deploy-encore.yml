name: Community managed notification audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-main-encore-deploy
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect automatic identity and scope boundaries
        env:
          DEPLOY_KEY: ${{ secrets.C_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/community-deploy-key"
          args=(-i "$RUNNER_TEMP/community-deploy-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/community-test/known_hosts)
          scp "${args[@]}" deploy/community-test/managed_notification_audit.py root@47.92.253.145:/opt/tp-community-actions/incoming/
          ssh "${args[@]}" root@47.92.253.145 'python3 /opt/tp-community-actions/incoming/managed_notification_audit.py' | tee managed-notification-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-notification-audit
          path: managed-notification-audit.json
      - name: Remove runner SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/community-deploy-key"
