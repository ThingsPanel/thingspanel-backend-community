name: CLI and UniPush checks
on:
  pull_request:
    paths:
      - 'cli/tpctl-go/**'
      - 'notification-adapters/**'
      - '.github/workflows/cli-unipush-checks.yml'
  push:
    paths:
      - 'cli/tpctl-go/**'
      - 'notification-adapters/**'
      - '.github/workflows/cli-unipush-checks.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test and build tpctl
        working-directory: cli/tpctl-go
        run: |
          go test ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/tpctl" .
      - name: Test and build UniPush plugin
        working-directory: notification-adapters
        run: |
          go test ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/unipush" ./cmd/unipush
