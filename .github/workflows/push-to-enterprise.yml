# ThingsPanel 社区版代码同步到企业版工作流
#
# 功能说明:
# 将社区版代码同步到企业版仓库的 thingspanel-backend-community 分支
#
# 触发方式:
# - 手动触发: 通过 GitHub Actions 页面手动触发同步
#
# 同步流程:
# 1. 检出企业版仓库
#   - 切换到 thingspanel-backend-community 分支
#   - 如果分支不存在则创建
#   - 清理分支上的所有文件
#
# 2. 检出社区版仓库
#   - 获取最新的社区版代码
#
# 3. 代码同步
#   - 使用 rsync 将社区版代码复制到企业版仓库
#   - 排除 .git 和 .github 目录
#
# 4. 提交更新
#   - 配置 Git 用户信息为 github-actions[bot]
#   - 提交并推送更改到企业版仓库
#
# 必需的 Secrets:
# - ACCESS_TOKEN: GitHub 访问令牌，需要有两个仓库的访问权限
#
# 注意事项:
# 1. 确保 ACCESS_TOKEN 有足够的权限访问两个仓库
# 2. 同步会覆盖目标分支上的所有文件
# 3. 不会同步 .git 和 .github 目录的内容
# 4. 建议在社区版代码稳定后再进行同步
# 5. 同步后请检查企业版的 thingspanel-backend-community 分支确保同步成功

name: push-to-enterprise

on:
  workflow_dispatch:
    # 允许手动触发

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      # 检出企业版仓库
      - name: Checkout Enterprise repository
        uses: actions/checkout@v4
        with:
          repository: 'ThingsPanel/thingspanel-backend-enterprise'
          token: ${{ secrets.ACCESS_TOKEN }}
          path: 'enterprise'
          fetch-depth: 0

      # 切换到thingspanel-backend-community分支或创建它
      - name: Setup or create target branch in enterprise
        run: |
          set -euo pipefail
          cd enterprise
          if git ls-remote --exit-code --heads origin thingspanel-backend-community >/dev/null 2>&1; then
            git fetch origin thingspanel-backend-community
            git checkout -B thingspanel-backend-community FETCH_HEAD
          else
            git checkout -b thingspanel-backend-community origin/main
          fi
          git rm -r --cached .
          git clean -fdx
        shell: bash

      # 检出社区版仓库
      - name: Checkout Community repository
        uses: actions/checkout@v4
        with:
          repository: 'ThingsPanel/thingspanel-backend-community'
          token: ${{ secrets.ACCESS_TOKEN }}
          path: 'community'
          fetch-depth: 0
          ref: master

      # 配置 Git 用户信息
      - name: Configure git identity
        run: |
          cd enterprise
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        shell: bash

      # 复制社区版代码到企业版thingspanel-backend-community分支
      - name: Copy Community code to Enterprise branch
        run: |
          rsync -av --exclude='.git' --exclude='.github' community/ enterprise/
        shell: bash

      # 提交变更到企业版的thingspanel-backend-community分支
      - name: Commit and push changes
        run: |
          set -euo pipefail
          cd enterprise
          git add .
          if git diff --cached --quiet; then
            echo "No community changes to sync"
          else
            git commit -m 'merge community changes to enterprise'
            git push origin thingspanel-backend-community
          fi
        shell: bash

      - name: Open Enterprise main pull request
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          open_pr=$(gh pr list \
            --repo ThingsPanel/thingspanel-backend-enterprise \
            --head thingspanel-backend-community \
            --base main \
            --state open \
            --json number \
            --jq 'length')
          if [ "$open_pr" -eq 0 ]; then
            gh pr create \
              --repo ThingsPanel/thingspanel-backend-enterprise \
              --base main \
              --head thingspanel-backend-community \
              --title "Sync Community backend changes" \
              --body "Merges the synchronized Community backend snapshot into Enterprise. Review before merging to trigger the Enterprise Demo deployment."
          fi
