name: Community backend test deploy
on:
  push:
    branches: [main]
    paths-ignore: ['encore-api/**', 'docs/**', '.ai/**', '**/*.md', 'deploy/release/**', '.github/workflows/release.yml', '.github/workflows/build-release.yml', '.github/workflows/docker-image-build.yml', '.github/workflows/encore-image-build.yml', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-main-backend-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify backend boundaries
        run: |
          go test ./internal/app ./internal/uplink ./internal/automationbridge ./internal/brokercontract ./internal/brokercontrol ./internal/brokermapper
          go test ./internal/api -run TestAutomationOwner
      - name: Build immutable backend bundle
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p candidate/configs
          go build -trimpath -ldflags "-s -w -X project/pkg/global.SYSTEM_VERSION=dev-$GITHUB_SHA" -o candidate/ThingsPanel-Go .
          test "$(candidate/ThingsPanel-Go --version)" = "dev-$GITHUB_SHA"
          cp -a sql static candidate/
          cp configs/casbin.conf configs/messages.yaml configs/messages_str.yaml candidate/configs/
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          root=pathlib.Path('candidate')
          manifest={'commit':os.environ['GITHUB_SHA'],'sha256':{str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
          tar -czf "backend-$GITHUB_SHA.tar.gz" -C candidate ThingsPanel-Go manifest.json sql static configs
      - name: Configure authenticated SSH
        env:
          DEPLOY_KEY: ${{ secrets.C_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/community-deploy-key"
          ssh -i "$RUNNER_TEMP/community-deploy-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/community-test/known_hosts root@47.92.253.145 'install -d -m 700 /opt/tp-community-actions/incoming'
      - name: Upload and deploy verified backend
        run: |
          set -euo pipefail
          args=(-i "$RUNNER_TEMP/community-deploy-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/community-test/known_hosts)
          scp "${args[@]}" "backend-$GITHUB_SHA.tar.gz" deploy/community-test/deploy_backend.py root@47.92.253.145:/opt/tp-community-actions/incoming/
          ssh "${args[@]}" root@47.92.253.145 "python3 /opt/tp-community-actions/incoming/deploy_backend.py '$GITHUB_SHA'"
      - name: Preserve source identity
        uses: actions/upload-artifact@v4
        with:
          name: backend-deployment-${{ github.sha }}
          path: candidate/manifest.json
      - name: Remove runner SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/community-deploy-key"
