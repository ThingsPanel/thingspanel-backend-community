# ThingsPanel 后端社区版自动部署工作流
# 通过 Tailscale SSH 访问 demo 主机，公网 22 端口可以保持关闭。
name: deploy
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Pack source
        run: tar -zcvf thingspanel-backend-community.tar.gz ./*
      - name: Upload via Tailscale SSH
        run: |
          set -euo pipefail
          tailscale ssh root@100.126.67.60 'cat > /home/thingspanel/thingspanel-backend-community.tar.gz' < thingspanel-backend-community.tar.gz
      - name: Deploy via Tailscale SSH
        run: |
          set -euo pipefail
          tailscale ssh root@100.126.67.60 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          find /home/thingspanel/thingspanel-backend-community -mindepth 1 ! -path '/home/thingspanel/thingspanel-backend-community/files*' -exec rm -rf {} +
          tar -zxvf /home/thingspanel/thingspanel-backend-community.tar.gz -C /home/thingspanel/thingspanel-backend-community
          cd /home/thingspanel/thingspanel-backend-community/
          BUILD_VERSION="dev-${{ github.sha }}"
          go build -ldflags "-X project/pkg/global.SYSTEM_VERSION=$BUILD_VERSION" -o thingspanel-backend-community
          test "$(./thingspanel-backend-community --version)" = "$BUILD_VERSION"
          /root/.local/share/pnpm/pm2 stop thingspanel-backend-community
          /root/.local/share/pnpm/pm2 start thingspanel-backend-community
          REMOTE_SCRIPT
