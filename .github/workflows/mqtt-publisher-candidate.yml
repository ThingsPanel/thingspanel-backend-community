name: Build MQTT-only publisher candidate
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: community-mqtt-publisher-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: publisher_test
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: publisher_test
        ports: ['25543:5432']
        options: >-
          --health-cmd "pg_isready -U publisher_test -d publisher_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: true
      - name: Verify release guards and preserve the current HTTP patch
        run: |
          set -euo pipefail
          git fetch origin 2a780fe468645cb500a8249670ac61da56aeda9f
          python3 -m unittest discover -s deploy/community-test -p test_mqtt_publisher_release.py
          python3 deploy/community-test/mqtt_publisher_release.py sources "$RUNNER_TEMP/mqtt-source"
      - name: Test the actual composed backend and broker sources
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mqtt-source/backend"
          go test ./internal/brokercontrol ./internal/brokercontract ./internal/adapter/mqttadapter ./internal/app ./internal/service -run 'Test(Target|GatewayTwoChildren|ServicePublish|ExplicitService|MQTTService)' -count=1
          go test ./internal/api -run 'Test(SharedHTTPInstallationScope|LegacyPluginCompatibilityAndHAFencing)' -count=1
          cd "$RUNNER_TEMP/mqtt-source/broker"
          go test ./internal/brokercontrol ./internal/brokercontract ./internal/mosquittodriver -count=1
      - name: Prove plugin publishing does not reacquire the dispatch lock
        env:
          TEST_BROKER_DATABASE_DSN: postgres://publisher_test:fixture-only-password@127.0.0.1:25543/publisher_test?sslmode=disable
        run: |
          set -euo pipefail
          for component in backend broker; do
            cd "$RUNNER_TEMP/mqtt-source/$component"
            go test ./internal/brokercontrol -run '^TestPostgresPluginPublisherAuthenticatesWhileDispatchHoldsRoute$' -count=1 -json > "$RUNNER_TEMP/$component-plugin-lock.jsonl"
          done
          python3 - <<'PY'
          import json, os, pathlib
          name = 'TestPostgresPluginPublisherAuthenticatesWhileDispatchHoldsRoute'
          for component in ('backend', 'broker'):
              rows = [json.loads(line) for line in (pathlib.Path(os.environ['RUNNER_TEMP']) / (component + '-plugin-lock.jsonl')).read_text().splitlines()]
              terminal = [row['Action'] for row in rows if row.get('Test') == name and row['Action'] in ('pass', 'fail', 'skip')]
              assert terminal == ['pass'], (component, terminal)
              print(component + ': real PostgreSQL dispatch-lock regression passed, zero skips')
          PY
      - name: Build owner and driver from the same preserved HA source
        run: |
          set -euo pipefail
          docker build -f "$RUNNER_TEMP/mqtt-source/broker/deploy/mosquitto-community/Dockerfile.production" -t "tp-mqtt-publisher:source-$GITHUB_SHA" "$RUNNER_TEMP/mqtt-source/broker"
      - name: Package checksummed runtime and rollback tooling
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/candidate"
          cd "$RUNNER_TEMP/mqtt-source/backend"
          go build -trimpath -ldflags "-s -w -X project/pkg/global.SYSTEM_VERSION=mqtt-publisher-$GITHUB_SHA" -o "$GITHUB_WORKSPACE/candidate/ThingsPanel-Go" .
          cd "$GITHUB_WORKSPACE"
          test "$(candidate/ThingsPanel-Go --version)" = "mqtt-publisher-$GITHUB_SHA"
          cp "$RUNNER_TEMP/mqtt-source/RELEASE_PROFILE.json" candidate/
          docker save "tp-mqtt-publisher:source-$GITHUB_SHA" | gzip -1 > candidate/broker-image.tar.gz
          cp deploy/community-test/mqtt_publisher_release.py candidate/
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tarfile
          root=pathlib.Path('candidate');sha=os.environ['GITHUB_SHA']
          image=json.loads(subprocess.check_output(['docker','image','inspect','tp-mqtt-publisher:source-'+sha]))[0]
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
              return h.hexdigest()
          manifest={'profile':'mqtt-target-publisher','commit':sha,'image_id':image['Id'],'image_size_bytes':image['Size'],
                    'sha256':{name:digest(root/name) for name in ['ThingsPanel-Go','broker-image.tar.gz','RELEASE_PROFILE.json']},
                    'tool_sha256':digest(root/'mqtt_publisher_release.py')}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          with tarfile.open('mqtt-publisher-'+sha+'.tar.gz','w:gz') as archive:
              for p in root.iterdir(): archive.add(p,arcname=p.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-publisher-${{ github.sha }}
          path: mqtt-publisher-${{ github.sha }}.tar.gz
          retention-days: 7
      - name: Stage candidate package without restarting services
        env:
          DEPLOY_KEY: ${{ secrets.C_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/mqtt-candidate-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          scp -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/community-test/known_hosts "mqtt-publisher-$GITHUB_SHA.tar.gz" root@47.92.253.145:/opt/tp-community-actions/incoming/
