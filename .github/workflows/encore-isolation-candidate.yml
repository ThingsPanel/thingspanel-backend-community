name: Encore Isolation Candidate (build only)

on:
  workflow_dispatch:
    inputs:
      owner_commit:
        description: Reviewed immutable owner command-validation commit (40 hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: encore-isolation-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      OWNER_COMMIT: ${{ inputs.owner_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release tooling safety gates
        run: python3 -m unittest discover -s deploy/community-test -p test_encore_isolation_candidate.py -v
      - name: Compose only the deployed Encore base and reviewed patches
        run: |
          set -euo pipefail
          [[ "$OWNER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$OWNER_COMMIT^{commit}" || git fetch --no-tags origin "$OWNER_COMMIT"
          python3 deploy/community-test/encore_isolation_candidate.py compose --owner-commit "$OWNER_COMMIT" --dest "$RUNNER_TEMP/encore-candidate"
          mkdir -p candidate-output
          cp "$RUNNER_TEMP/encore-candidate/composition.json" candidate-output/
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/encore-candidate/encore-api/go.mod
          cache: false
      - name: Install checksum-pinned Encore CLI
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://d2f391esomvqpi.cloudfront.net/encore-1.58.6-linux_amd64.tar.gz -o "$RUNNER_TEMP/encore-cli.tar.gz"
          echo "46add1a88eb02349e4ce51269fdade91c52e8fc044c972cc0ae40129a1eb91b2  $RUNNER_TEMP/encore-cli.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/encore-cli"
          tar -xzf "$RUNNER_TEMP/encore-cli.tar.gz" -C "$RUNNER_TEMP/encore-cli"
          echo "ENCORE_INSTALL=$RUNNER_TEMP/encore-cli" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/encore-cli/bin" >> "$GITHUB_PATH"
      - name: Verify Docker for real Encore PostgreSQL test databases
        run: docker info > /dev/null
      - name: Test isolation, owner replay and action compatibility on composed source
        working-directory: ${{ runner.temp }}/encore-candidate/encore-api
        run: |
          set -euo pipefail
          encore test -p=1 -json ./automation/... -run '^(TestQ09|TestEveryDeclaredStepKindHasARealImplementation)' | tee "$GITHUB_WORKSPACE/candidate-output/automation-tests.jsonl"
          encore test -p=1 -json ./thingmodel ./thingmodel/core -run '^(TestOwnerCommandValidation|TestPublishedCommand|TestPostgresOwnerCommandValidationUsesCommunityTenantMapping)' | tee "$GITHUB_WORKSPACE/candidate-output/owner-contract-tests.jsonl"
      - name: Reject missing, skipped or failed required tests
        run: |
          python3 deploy/community-test/encore_isolation_candidate.py test-gate candidate-output/automation-tests.jsonl candidate-output/owner-contract-tests.jsonl --report candidate-output/test-gate.json
          python3 deploy/community-test/encore_isolation_candidate.py verify-source --dest "$RUNNER_TEMP/encore-candidate"
      - name: Build matching nine services without deployment configuration
        working-directory: ${{ runner.temp }}/encore-candidate/encore-api
        run: |
          set -euo pipefail
          encore build docker "tp-community-encore:qa-isolation-$GITHUB_SHA" --arch=amd64 --services=authn,thingmodel,devicemetadata,fileassets,connectorcatalog,automation,notification,marketinstall,platformconfig --skip-config
      - name: Package immutable build-only artifact
        run: |
          set -euo pipefail
          python3 deploy/community-test/encore_isolation_candidate.py verify-source --dest "$RUNNER_TEMP/encore-candidate"
          docker save "tp-community-encore:qa-isolation-$GITHUB_SHA" | gzip -1 > candidate-output/image.tar.gz
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tarfile
          output=pathlib.Path('candidate-output')
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'encore-candidate'
          composition=json.loads((source/'composition.json').read_text())
          image=json.loads(subprocess.check_output(['docker','image','inspect','tp-community-encore:qa-isolation-'+os.environ['GITHUB_SHA']]))[0]
          assert image['Architecture']=='amd64' and image['Os']=='linux'
          (output/'image.json').write_text(json.dumps({'docker_image_id':image['Id'],'image_size':image['Size'],'os':image['Os'],'architecture':image['Architecture'],'tooling_commit':os.environ['GITHUB_SHA'],'owner_commit':os.environ['OWNER_COMMIT'],'composition_sha256':composition['composition_sha256'],'services':composition['services'],'deployed':False},indent=2))
          with tarfile.open(output/'source.tar.gz','w:gz') as archive:
              for name in sorted(composition['source_sha256']):archive.add(source/name,arcname=name,recursive=False)
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1048576),b''):h.update(chunk)
              return h.hexdigest()
          (output/'checksums.json').write_text(json.dumps({p.name:sha(p) for p in output.iterdir() if p.is_file()},indent=2))
          PY
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encore-isolation-${{ github.sha }}-${{ inputs.owner_commit }}
          path: candidate-output/
          if-no-files-found: error
          retention-days: 7
