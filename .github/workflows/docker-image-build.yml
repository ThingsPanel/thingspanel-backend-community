name: Docker Image Build
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing published release tag
        required: true
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - component: backend
            image: thingspanel-go
            dockerfile: Dockerfile
          - component: broker
            image: thingspanel-mosquitto
            dockerfile: deploy/mosquitto-community/Dockerfile.production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select immutable release source
        env:
          REQUESTED_TAG: ${{ inputs.version }}
        run: python3 deploy/release/release.py select-tag --version "$REQUESTED_TAG"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.IMAGE_USER }}
          password: ${{ secrets.IMAGE_PASS }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            thingspanel/${{ matrix.image }}:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ env.VERSION }}
            registry.cn-hangzhou.aliyuncs.com/thingspanel/${{ matrix.image }}:${{ env.VERSION }}
      - name: Record verified registry manifests
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ matrix.image }}
        run: |
          python3 deploy/release/release.py record-image --version "$VERSION" --component "$COMPONENT" --image "$IMAGE"
          gh release upload "$VERSION" "release-records/$COMPONENT-image.json" --clobber
