      - state
      - acceptedAt
      - deliveryAt
      - acknowledgedAt
      - reason
      - expiresAt
      - identifier
      - snapshotId
      - deliveryMode
      - label
      - parameters
      - redactedParameterPaths
      description: accepted/delivered/协议ACK/物理效果分别记录；不能把202或MQTT ACK解释为设备物理效果。 label与parameters来自提交时冻结输入，刷新/重启后可读；脱敏结果不能当作无损可重放请求；原始秘密不写普通日志/导出。
