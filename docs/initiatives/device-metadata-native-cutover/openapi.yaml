          anyOf:
          - type: string
            minLength: 0
            maxLength: 100
          - type: 'null'
      required:
      - identifier
      - snapshotId
      - parameters
      description: parameters 必须满足该设备运行中固定快照的 COMMAND schema；客户端不能选择别的设备模型来扩大能力。 when_online必须明确expiresAt（最多24h），由control
        owner管理队列；过期不投递。旧遥测/属性下发须映射为已声明COMMAND，不能恢复任意属性写旁路。 label为可选用户标签，不是COMMAND identifier或授权字段；省略按null。
    CommandReceipt:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        deviceId:
          $ref: '#/components/schemas/Id'
        state: *id032
        acceptedAt:
          $ref: '#/components/schemas/Timestamp'
        deliveryAt:
          anyOf:
