      - devicemetadata
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - &id002
        in: query
        name: search
        schema:
          type: string
          minLength: 0
          maxLength: 128
      - &id003
        in: query
        name: deviceNumber
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - &id004
        in: query
        name: deviceKind
