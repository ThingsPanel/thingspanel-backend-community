          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        reason:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 512
          - type: 'null'
        expiresAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        identifier:
          $ref: '#/components/schemas/NativeThingModelIdentifier'
        snapshotId:
          $ref: '#/components/schemas/Id'
        deliveryMode:
          type: string
          enum:
          - immediate
          - when_online
        label:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 100
          - type: 'null'
        parameters:
          type: object
          additionalProperties: true
          description: 本次已接受请求参数的持久读回；按同一control授权和敏感参数策略脱敏，遮蔽位置为null并列出JSON Pointer，不以错误截断/改名重建。
