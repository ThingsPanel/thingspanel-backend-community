x-runtime-event-contracts:
  version: 1
  owner: devicemetadata/device-runtime
  task: DM-RT-007
  delivery: existing-outbox-at-least-once
  schemas:
    desired:
      $ref: '#/components/schemas/DeviceConfigurationEvent'
    receipt:
      $ref: '#/components/schemas/RuntimeConfigurationReceipt'
  rules:
  - 受认证服务传输；tenant/device/scope与payload一致，权限不得由事件body自行指定。
  - 按tenant/device先fence再状态行加锁；相同generation+digest重放持久receipt；相同generation不同digest为GENERATION_CONFLICT。
  - 小于已应用generation返回stale；大于applied+1先持久缓冲并从既有outbox重送缺失generation，不跳过副作用；初始代从1开始。
  - generation连续且消息验证通过后，设备实际配置应用与runtime持久receipt按既有运行账本恢复；received/失败不推进applied。
  - metadata只按可信applied回执完成作业或生命周期转换；遥测/在线状态继续由runtime独立拥有。
x-offline-migration-contracts:
  product:
    schema:
      $ref: '#/components/schemas/ProductMigrationRecord'
    owner: devicemetadata
    task: DM-MIG-006
    audience: approved-offline-upgrade
    httpExposure: false
x-runtime-private-contracts:
  resolveRuntimeCredential:
    owner: devicemetadata
    task: DM-DEV-009
    storageTask: DM-DB-007
    consumerTask: DM-RT-007
    audience: authenticated-runtime-service
    transport: Encore private service call; no public HTTP registration
    request:
      $ref: '#/components/schemas/ResolveRuntimeCredential'
    response:
      $ref: '#/components/schemas/RuntimeCredentialMaterial'
    errors:
      $ref: '#/components/schemas/Problem'
    permission: credential.runtime:resolve
    tenantSource: verified-service-context
    httpExposure: false
    secretPolicy: mTLS or equivalent authenticated encrypted service transport; no log/trace/outbox/cache/durable plaintext;
      authorized runtime storage encrypted using existing key facilities
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: verified access token
      description: 由正式身份服务校验签名/受众/过期/撤销并派生tenant、subject、roles、resource scopes。禁止客户端任意tenantId或调试头。
    enrollmentCredential:
      type: http
      scheme: bearer
      bearerFormat: scoped enrollment credential
      description: 用途独立、可撤销的template引导凭据；服务端解析tenant/template，不能从body/header指定tenant。非普通管理token。
    enrollmentStatus:
      type: http
      scheme: bearer
      bearerFormat: single-enrollment status capability
      description: 签名短期能力，只能查询绑定job/device/tenant的非敏感状态；不是template secret或管理token。
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      in: query
      name: search
      schema:
        type: string
        minLength: 0
        maxLength: 128
      description: 去除首尾空白；匹配 name 与业务编号；参数绑定，不拼接 SQL。
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: 本项目持久幂等合同；按 tenant+subject+operationId+规范路径+key 隔离，同键异 payload 为 409。不是宣称某份 HTTP 草案已成为 RFC。
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 160
      description: GET 此资源所得强 ETag；缺失 428，不匹配 412。拒绝 * 与弱 ETag 以避免跳过并发检查。
  headers:
    XRequestId:
      description: 关联请求和审计
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ETag:
      description: 当前资源强 ETag
      schema:
        type: string
        minLength: 3
        maxLength: 160
    Location:
      description: 新资源或异步操作的相对 URI
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: 重试前等待的秒数
      schema:
        type: integer
        minimum: 1
        maximum: 3600
  responses:
    '400':
      description: 语法、未知查询参数或游标错误
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '401':
      description: >-
        Encore auth handler 在请求进入业务服务前拒绝凭据时返回 Encore 原生错误；此认证引导响应不承诺 Problem/requestId。若业务handler已执行并拒绝认证，则使用 RFC9457 Problem。Bearer challenge不得泄漏token。
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
          description: >-
            Required Bearer challenge on the public ingress. The ingress decorates
            Encore's pre-handler authentication response without validating credentials
            or changing its response body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncoreAuthError'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '403':
      description: 已认证但动作无权限
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '404':
      description: 资源不存在或不在当前租户/资源范围
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '409':
      description: 业务冲突、引用冲突、同键异参或操作进行中
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '412':
      description: 并发前置条件失败
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '422':
      description: schema、字段、关系或协议配置不合法
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '428':
      description: 缺少并发前置条件
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '429':
      description: 限流
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '500':
      description: 内部错误
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '503':
      description: 正式依赖不可用；不回退旧 API/旧表
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '410':
      description: 受控文件或临时结果已过期
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      format: uuid
      description: RFC 9562 UUID；服务端生成，客户端按不透明字符串使用。旧 ID 仅进入迁移账本。
    Timestamp: *id024
    Version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    RequestMeta:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - requestId
    EncoreAuthError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 0
          maxLength: 2048
        details: {}
      required:
      - code
      - message
      - details
      description: >-
        Encore auth handler在业务服务处理前拒绝请求时的原生错误体。该边界不属于服务生成的RFC9457 Problem，故不要求requestId。
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 0
          maxLength: 2048
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
          maxLength: 128
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              pointer:
                type: string
                minLength: 0
                maxLength: 256
              code:
                type: string
                minLength: 1
                maxLength: 128
              message:
                type: string
                minLength: 0
                maxLength: 512
            required:
            - pointer
            - code
            - message
          minItems: 0
          maxItems: 100
        conflicts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                minLength: 1
                maxLength: 64
              reasonCode:
                type: string
                minLength: 1
                maxLength: 128
              visibleResourceId:
                anyOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            required:
            - kind
            - reasonCode
            - visibleResourceId
          minItems: 0
          maxItems: 100
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - requestId
      description: RFC 9457；code 是稳定机器码；不泄漏 SQL、凭据或其他租户资源。扩展字段必须在此契约登记。
    Labels:
      type: object
      maxProperties: 32
      propertyNames:
        pattern: ^[A-Za-z0-9_.-]{1,64}$
      additionalProperties:
        type: string
        minLength: 0
        maxLength: 256
    Location:
      type: object
      additionalProperties: false
      properties:
        latitude:
          anyOf:
          - type: number
            minimum: -90
            maximum: 90
          - type: 'null'
        longitude:
          anyOf:
          - type: number
            minimum: -180
            maximum: 180
          - type: 'null'
        address:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 512
          - type: 'null'
      required:
      - latitude
      - longitude
      - address
      description: 坐标同时存在或同时null；允许仅地址文字，保存旧位置文字不伪造经纬度。
    ThingModelBinding:
      type: object
      additionalProperties: false
      properties:
        modelId:
          $ref: '#/components/schemas/Id'
        snapshotId:
          $ref: '#/components/schemas/Id'
        publishedRevision:
          $ref: '#/components/schemas/NativeThingModelRevision'
        snapshotDigest:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
          description: 物模型语义checksum，不包含Web/App资源。
        resourcesDigest:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
      required:
      - modelId
      - snapshotId
      - publishedRevision
      - snapshotDigest
      - resourcesDigest
      description: 同一tenant/model/published revision/snapshot；语义snapshotDigest与resourcesDigest分别验证。资源摘要来自既有thingmodel
        publication，不在metadata重新计算影子模型。
    ThingModelSelection:
      type: object
      additionalProperties: false
      properties:
        modelId:
          $ref: '#/components/schemas/Id'
        publishedRevision:
          $ref: '#/components/schemas/NativeThingModelRevision'
      required:
      - modelId
      - publishedRevision
      description: 写入选择器；服务端读回快照并验证，生成完整 ThingModelBinding。
    RuntimeRef:
      type: object
      additionalProperties: false
      properties:
        providerId:
          $ref: '#/components/schemas/Id'
        namespace:
          type: string
          minLength: 1
          maxLength: 128
        externalId:
          type: string
          minLength: 1
          maxLength: 256
        serviceInstanceId:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 256
          - type: 'null'
      required:
      - providerId
      - namespace
      - externalId
      - serviceInstanceId
      description: 运行时 owner 的稳定身份引用；不是旧 device_configs 或旧 Gin ID 的日常 resolver。
    AuditFields:
      type: object
      additionalProperties: false
      properties:
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          type: string
          minLength: 1
          maxLength: 128
        updatedBy:
          type: string
          minLength: 1
          maxLength: 128
        resourceVersion:
          $ref: '#/components/schemas/Version'
      required:
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      - resourceVersion
    Operation:
      type: object
      additionalProperties: false
      properties:
        id: &id025
          $ref: '#/components/schemas/Id'
        tenantId: &id026
          $ref: '#/components/schemas/Id'
        createdAt: &id027
          $ref: '#/components/schemas/Timestamp'
        updatedAt: &id028
          $ref: '#/components/schemas/Timestamp'
        createdBy: &id029
          type: string
          minLength: 1
          maxLength: 128
        updatedBy: &id030
          type: string
          minLength: 1
          maxLength: 128
        resourceVersion: &id031
          $ref: '#/components/schemas/Version'
        kind:
          type: string
          enum:
          - device_activation
          - device_deletion
          - device_renumber
          - administrative_state
          - template_binding
          - gateway_binding
          - credential_change
          - batch_create
          - batch_template_binding
          - device_import
          - device_export
          - template_import
          - template_export
          - gateway_binding_batch
          - reading_export
        state:
          type: string
          enum:
          - pending
          - running
          - succeeded
          - failed
          - cancelled
        resourceId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        progress:
          type: object
          additionalProperties: false
          properties:
            total:
              type: integer
              minimum: 0
              maximum: 2147483647
            completed:
              type: integer
              minimum: 0
              maximum: 2147483647
            failed:
              type: integer
              minimum: 0
              maximum: 2147483647
          required:
          - total
          - completed
          - failed
        result:
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              resourceIds:
                type: array
                items:
                  $ref: '#/components/schemas/Id'
                minItems: 0
                maxItems: 10000
              downloadId:
                anyOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
              checksum:
                anyOf:
                - type: string
                  minLength: 64
                  maxLength: 64
                - type: 'null'
          - type: 'null'
        failure:
          anyOf:
          - $ref: '#/components/schemas/Problem'
          - type: 'null'
        expiresAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - id
      - tenantId
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      - resourceVersion
      - kind
      - state
      - resourceId
      - progress
      - result
      - failure
      - expiresAt
      description: 202 只代表受理。按同一主体/租户授权查询；只有 succeeded 表示所有要求的步骤完成，失败不得伪装成功。
    OperationItem:
      type: object
      additionalProperties: false
      properties:
        itemKey:
          type: string
          minLength: 1
          maxLength: 128
        sourceRow:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 2147483647
          - type: 'null'
        state:
          type: string
          enum:
          - pending
          - succeeded
          - failed
          - skipped
        resourceId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/Problem'
          - type: 'null'
      required:
      - itemKey
      - sourceRow
      - state
      - resourceId
      - error
    Product:
      type: object
      additionalProperties: false
      properties:
        id: *id025
        tenantId: *id026
        createdAt: *id027
        updatedAt: *id028
        createdBy: *id029
        updatedBy: *id030
        resourceVersion: *id031
        name:
          type: string
          minLength: 1
          maxLength: 128
        productKey:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 128
          - type: 'null'
        sku:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 128
          - type: 'null'
        productType:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 64
          - type: 'null'
        modelCode:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 128
          - type: 'null'
        imageUrl:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 1024
          - type: 'null'
          readOnly: true
        otaPackageId:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 256
          - type: 'null'
        defaultTemplateId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        description:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 2000
          - type: 'null'
        imageAssetId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - id
      - tenantId
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      - resourceVersion
      - name
      - productKey
      - sku
      - productType
      - modelCode
      - imageUrl
      - otaPackageId
      - defaultTemplateId
      - description
      - imageAssetId
      description: 复用既有products目录和接入关联；可选，不自动创建。defaultTemplateId为当前模板选择器建议值，创建设备请求须显式选择，不存在隐式切换。产品完整管理不属于本次三个菜单。
    DeviceKind:
      type: string
      enum:
      - standalone
      - gateway
      - subdevice
    AccessMode:
      type: string
      enum:
      - direct
      - protocol_connector
      - service_connector
      - gateway
    CredentialPolicy:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - none
          - token
          - username_password
          - x509
        autoRegister: *id001
      required:
      - kind
      - autoRegister
    AccessConfiguration:
      type: object
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/AccessMode'
        protocol:
          type: string
          minLength: 1
          maxLength: 64
        providerId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        providerVersion:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        schemaDigest:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        parameters:
          type: object
          description: 必须匹配已锁定 providerVersion/schemaDigest 的正式 connector JSON Schema；禁止任何明文 secret；64 KiB 上限由服务实施。
          additionalProperties: true
        credentialPolicy:
          $ref: '#/components/schemas/CredentialPolicy'
        onlinePolicy:
          type: object
          additionalProperties: false
          properties:
            mode:
              type: string
              enum:
              - transport
              - heartbeat
              - activity
            timeoutSeconds:
              type: integer
              minimum: 1
              maximum: 86400
          required:
          - mode
          - timeoutSeconds
        connectionDirection:
          type: string
          enum:
          - device_to_platform
          - platform_to_device
        serviceInstanceId:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 256
          - type: 'null'
      required:
      - mode
      - protocol
      - providerId
      - parameters
      - credentialPolicy
      - onlinePolicy
      - connectionDirection
      - serviceInstanceId
      description: 期望配置由devicemetadata保存，connector/runtime解释执行。gateway接入允许subdevice或provider明确支持多级的gateway；父必须gateway。access
        mode、connectionDirection、deviceKind是正交字段。 service_connector模式必须serviceInstanceId，其他模式按provider能力决定；该ID由connector正式目录解析归属与版本，不是任意tenant输入。parameters只含公共连接配置。
    TemplateConfiguration:
      type: object
      additionalProperties: false
      properties:
        deviceKind:
          $ref: '#/components/schemas/DeviceKind'
        model:
          anyOf:
          - $ref: '#/components/schemas/ThingModelSelection'
          - type: 'null'
        access:
          $ref: '#/components/schemas/AccessConfiguration'
        topicMappings:
          type: array
          items:
            $ref: '#/components/schemas/TopicMapping'
          minItems: 0
          maxItems: 1000
        processingScripts:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingScript'
          minItems: 0
          maxItems: 100
        customFieldDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldDefinition'
          minItems: 0
          maxItems: 100
      required:
      - deviceKind
      - model
      - access
      - topicMappings
      - processingScripts
      - customFieldDefinitions
      description: model=null 是合法未建模；当前配置不自动创建空模型。
    DeviceAccessTemplate:
      type: object
      additionalProperties: false
      properties:
        id: *id025
        tenantId: *id026
        createdAt: *id027
        updatedAt: *id028
        createdBy: *id029
        updatedBy: *id030
        resourceVersion: *id031
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 2000
          - type: 'null'
        brand:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 64
          - type: 'null'
        productName:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 128
          - type: 'null'
        modelNumber:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 64
          - type: 'null'
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          minItems: 0
          maxItems: 32
          uniqueItems: true
        configuration:
          $ref: '#/components/schemas/TemplateConfiguration'
        administrativeState:
          type: string
          enum:
          - enabled
          - disabled
        imageAssetId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        deviceCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 主体可见且未删除、当前引用本模板的设备去重数；列表批量聚合，非N+1。
      required:
      - id
      - tenantId
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      - resourceVersion
      - name
      - description
      - brand
      - productName
      - modelNumber
      - tags
      - configuration
      - administrativeState
      - imageAssetId
      - deviceCount
      description: 菜单“设备模板”的唯一原生实体，保存一份当前configuration；封面只返回imageAssetId，下载地址由FileAsset GET按授权提供；停用只阻止新绑定/新激活，不自动断开现有设备。
    CreateDeviceAccessTemplate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 2000
          - type: 'null'
        brand:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 64
          - type: 'null'
        productName:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 128
          - type: 'null'
        modelNumber:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 64
          - type: 'null'
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          minItems: 0
          maxItems: 32
          uniqueItems: true
        configuration:
          $ref: '#/components/schemas/TemplateConfiguration'
        imageAssetId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - name
      - configuration
      description: 可选显示字段省略时采用 null，tags 默认为 []；configuration 是创建时唯一的当前配置。
    UpdateDeviceAccessTemplate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 2000
          - type: 'null'
        brand:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 64
          - type: 'null'
        productName:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 128
          - type: 'null'
        modelNumber:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 64
          - type: 'null'
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          minItems: 0
          maxItems: 32
          uniqueItems: true
        customFieldChanges:
          $ref: '#/components/schemas/TemplateCustomFieldChanges'
        configuration:
          $ref: '#/components/schemas/TemplateConfiguration'
        administrativeState:
          type: string
          enum:
          - enabled
          - disabled
        imageAssetId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      allOf:
      - not:
          required:
          - configuration
          - customFieldChanges
      description: customFieldChanges与configuration互斥；仅提交字段增改删时保留所有其它配置和未改默认值的数值精度。显式JSON部分更新；省略不改；null仅清除允许为空的字段；configuration/数组/对象整体替换并立即保存当前值，完整校验。非JSON Merge Patch。
    ValidationIssue:
      type: object
      additionalProperties: false
      properties:
        pointer:
          type: string
          minLength: 0
          maxLength: 256
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 0
          maxLength: 512
        severity:
          type: string
          enum:
          - error
          - warning
      required:
      - pointer
      - code
      - message
      - severity
    ValidationReport:
      type: object
      additionalProperties: false
      properties:
        valid: *id001
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
          minItems: 0
          maxItems: 1000
        sourceDigest:
          type: string
          minLength: 64
          maxLength: 64
      required:
      - valid
      - issues
      - sourceDigest
    TemplateReference:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - device
          - product
          - market_package
          - automation
          - alarm
        id:
          $ref: '#/components/schemas/Id'
        displayName:
          type: string
          minLength: 0
          maxLength: 128
      required:
      - kind
      - id
      - displayName
      description: 只返回当前主体有权查看的引用。不可见引用不进列表；删除409的Problem.conflicts只返回类别和阻断码，visibleResourceId=null。
    TemplatePackage:
      type: object
      additionalProperties: false
      properties:
        formatVersion:
          type: string
          enum:
          - '1'
        template:
          $ref: '#/components/schemas/CreateDeviceAccessTemplate'
        contentDigest:
          type: string
          minLength: 64
          maxLength: 64
        assets:
          type: array
          items:
            $ref: '#/components/schemas/PackagedImageAsset'
          minItems: 0
          maxItems: 10
        modelPackage:
          anyOf:
          - $ref: '#/components/schemas/NativeThingModelSnapshotDetail'
          - type: 'null'
          description: 模板当前配置引用模型时，包含所选固定 SnapshotDetail 全量模型、资源及两个独立 checksum；无模型时为 null。源 modelId/snapshotId/revision
            是受验证的包内引用，导入后使用持久 ID 映射，不能指定目标租户或覆盖目标对象。
          x-release-task: DM-API-007
      required:
      - formatVersion
      - template
      - contentDigest
      - assets
      - modelPackage
      description: 仅包含可分享的模板元数据和可选完整物模型发布快照；排除凭据与运行时状态。modelPackage 的身份只用于源依赖清单/导入映射，目标 tenant 始终由认证决定。contentDigest
        是包完整性摘要；modelPackage.checksum 是包含源身份/revision 的语义快照摘要；resourcesChecksum 是资源摘要。跨身份导入可生成新的语义 checksum，不能要求三者相同。包规范化算法由模板导出/导入任务冻结并以黄金样例验收。
    Device:
      type: object
      additionalProperties: false
      properties:
        id: *id025
        tenantId: *id026
