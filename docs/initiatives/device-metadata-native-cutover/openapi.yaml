      description: 模板当前配置中的值；每个期望配置generation携带当次使用的配置快照。runtime按priority及id稳定排序执行，禁止越租户topic目标。dataIdentifier引用同版本模型，缺失时规则失败而非绑定latest。
        dataKind/dataIdentifier必须同时null或同时非null；字段引用键=(kind,identifier)，同名异kind不得混淆。
