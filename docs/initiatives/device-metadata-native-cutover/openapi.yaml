          type: integer
          minimum: 1
          maximum: 300
          default: 30
        deliveryMode:
          type: string
          enum:
          - immediate
          - when_online
          default: immediate
        expiresAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
