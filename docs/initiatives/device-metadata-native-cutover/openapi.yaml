      - &id010
        in: query
        name: administrativeState
        schema:
          type: string
          enum:
          - enabled
          - disabled
      - &id011
        in: query
        name: activationState
        schema:
          type: string
          enum:
          - inactive
          - active
      - &id012
        in: query
        name: connectivity
        schema:
          type: string
          enum:
          - online
          - offline
          - unknown
      - &id013
        in: query
        name: label
        schema:
          type: string
          minLength: 0
          maxLength: 322
      - &id014
        in: query
        name: sort
        schema:
          type: string
          enum:
          - createdAt
          - -createdAt
          - name
          - -name
          - deviceNumber
          - -deviceNumber
      - in: query
        name: groupScope
        schema: &id015
          type: string
          enum:
          - all
          - ungrouped
      - in: query
        name: accessWay
        schema: &id016
          type: string
          enum:
          - protocol
          - service
      - in: query
        name: protocol
        schema: &id017
          type: string
          minLength: 0
          maxLength: 64
      - in: query
        name: providerId
        schema: &id018
          $ref: '#/components/schemas/Id'
      - in: query
        name: serviceInstanceId
        schema: &id019
          type: string
          minLength: 0
          maxLength: 256
      - in: query
        name: firmwareVersion
        schema: &id020
          type: string
          minLength: 0
          maxLength: 128
      - in: query
        name: batchNumber
        schema: &id021
          type: string
          minLength: 0
          maxLength: 128
      - in: query
        name: alarmState
        schema: &id022
          type: string
          enum:
          - any
          - active
          - none
      - in: query
        name: modelId
        schema: &id023
          $ref: '#/components/schemas/Id'
      - in: query
        name: hasTemplate
        schema: *id001
      - in: query
        name: gatewayScope
        schema:
          type: string
          enum:
          - all
          - bound
          - unbound
