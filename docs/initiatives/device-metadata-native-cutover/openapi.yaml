    TemplateCustomFieldChanges:
      type: object
      additionalProperties: false
      properties:
        upsert:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/TemplateCustomFieldUpsert'
        remove:
          type: array
          minItems: 0
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
      required:
      - upsert
      - remove
      anyOf:
      - properties:
          upsert:
            minItems: 1
      - properties:
          remove:
            minItems: 1
      description: 仅修改模板当前customFieldDefinitions；upsert+remove合计1..100项，key各自唯一且两数组不重叠。保留原顺序，新key按upsert顺序追加。删除已被live设备保存的key（含false/0/null）或不兼容改型/枚举/重启用返回409；停用保留历史值。无版本、草稿、发布或预览作业。
    TemplateCustomFieldUpsert:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum:
          - string
          - number
          - boolean
          - enum
        defaultValue:
          anyOf:
          - type:
            - string
            - number
            - boolean
          - type: 'null'
        description:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 2000
          - type: 'null'
        enabled:
          type: boolean
        enumValues:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              value:
                type: string
                minLength: 1
                maxLength: 256
              label:
                type: string
                minLength: 1
                maxLength: 256
            required:
            - value
            - label
          minItems: 0
          maxItems: 1000
          uniqueItems: true
      required:
      - key
      description: 按key局部修改当前字段定义；省略属性保留已有原值，null明确写入空值。新增key合成后须满足完整CustomFieldDefinition；已有定义不改默认值时不提交defaultValue。
    CustomFieldDefinition:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum:
          - string
          - number
          - boolean
          - enum
        defaultValue:
          anyOf:
          - type:
            - string
            - number
            - boolean
          - type: 'null'
        description:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 2000
          - type: 'null'
        enabled: *id001
        enumValues:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              value:
                type: string
                minLength: 1
                maxLength: 256
              label:
                type: string
                minLength: 1
                maxLength: 256
            required:
            - value
            - label
          minItems: 0
          maxItems: 1000
          uniqueItems: true
      required:
      - key
      - name
      - type
      - defaultValue
      - description
      - enabled
      - enumValues
      description: 设备自定义资料定义，不是物模型字段；默认值必须符合type；key唯一。停用后保留已有值；删除已保存key或不兼容改型/枚举/重启用由同事务检查并返回409，不静默清除设备值。 enum类型必须非空唯一选项/default属于选项；其他类型enumValues=[]；旧Enum仅在源值可无损归一时迁入，否则异常报告。
