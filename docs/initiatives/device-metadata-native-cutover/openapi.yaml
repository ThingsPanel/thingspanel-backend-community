      description: value 按固定 snapshot 的字段类型验证；历史无模型数据显式 snapshotId=null，不用当前最新模型重解释。原始历史不写元数据库。 sampleId是telemetry
        owner不可混淆的采样身份；latest响应cacheVersion非null，历史可null。相同observedAt不代表同一次采样。 raw时窗口/样本数均null；聚合时windowStart/End为自然固定桶边界，observedAt=windowStart，sampleCount为实际参与数；仅使用[from,to)中的样本，首尾桶可以不完整。按kind+identifier+snapshotId分别聚合，不跨类型/单位版本混算。聚合sampleId为owner生成的稳定桶身份，cacheVersion=null；空桶不填0。
