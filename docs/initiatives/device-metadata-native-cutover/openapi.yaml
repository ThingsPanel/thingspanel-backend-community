      - contentDigest
      - configuration
      description: metadata outbox已提交的事实；eventId重发不变。contentDigest=SHA256(RFC8785 JCS(configuration))，不改物模型既有checksum算法。tenantId来自事务可信上下文，消费端还须验证传输身份/租户scope，不能只信payload。operationId可空；非空时指metadata持久作业。
    RuntimeConfigurationReceipt:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        receiptId:
          $ref: '#/components/schemas/Id'
        eventId:
          $ref: '#/components/schemas/Id'
        tenantId:
          $ref: '#/components/schemas/Id'
        deviceId:
          $ref: '#/components/schemas/Id'
        generation:
          $ref: '#/components/schemas/Version'
        contentDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
          minLength: 64
          maxLength: 64
        state:
          type: string
          enum:
          - received
          - applied
          - failed
          - stale
        observedAt:
          $ref: '#/components/schemas/Timestamp'
        appliedGeneration:
          anyOf:
          - $ref: '#/components/schemas/Version'
          - type: 'null'
        failureCode:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        retryable:
          type: boolean
      required:
      - schemaVersion
      - receiptId
      - eventId
      - tenantId
      - deviceId
      - generation
      - contentDigest
      - state
      - observedAt
      - appliedGeneration
      - failureCode
      - retryable
      description: runtime账本为唯一owner；applied仅在真实配置应用后产生，失败不推进appliedGeneration。received不是业务成功。failed必须failureCode；applied的appliedGeneration=事件generation且failureCode=null；stale返回当前已应用generation，不产生应用副作用。这些跨字段值相等由合同测试验证。
      allOf:
      - if:
          properties:
            state:
              const: failed
        then:
          properties:
            failureCode:
              type: string
              minLength: 1
              maxLength: 128
      - if:
          properties:
            state:
              const: applied
        then:
          properties:
            appliedGeneration:
              $ref: '#/components/schemas/Version'
            failureCode:
              type: 'null'
            retryable:
              const: false
    ProductMigrationRecord:
      type: object
      additionalProperties: false
      properties:
        sourceProductId:
          type: string
          minLength: 1
          maxLength: 256
        sourceTenantId:
          type: string
          minLength: 1
          maxLength: 256
        name:
          type: string
          minLength: 1
          maxLength: 128
        productKey:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 128
          - type: 'null'
        sku:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 128
          - type: 'null'
        productType:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 64
          - type: 'null'
        modelCode:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 128
          - type: 'null'
        otaPackageId:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 256
          - type: 'null'
        defaultTemplateId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        description:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 2000
          - type: 'null'
        imageAssetId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - sourceProductId
      - sourceTenantId
      - name
      - productKey
      - sku
      - productType
      - modelCode
      - otaPackageId
      - defaultTemplateId
      - description
      - imageAssetId
      description: 仅离线受控升级输入，不注册HTTP或CLI operation。sourceTenantId为来源证据，授权tenant必须从获准migration run及永久映射推导并校验相等；目标ID由owner分配/复用且保存持久map。图片/OTA/default
        revision只接受已验证同tenant的正式owner引用。
    ResolveRuntimeCredential:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          $ref: '#/components/schemas/Id'
        credentialId:
          $ref: '#/components/schemas/Id'
        configurationGeneration:
          $ref: '#/components/schemas/Version'
        expectedFingerprint:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - deviceId
      - credentialId
      - configurationGeneration
      - expectedFingerprint
      description: 仅内部已授权runtime主体调用；可信tenant、provider身份和purpose从服务上下文取。验证该凭据属于该设备且被该已提交generation明确引用，不能任意枚举凭据。
    RuntimeCredentialMaterial:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          $ref: '#/components/schemas/Id'
        credentialId:
          $ref: '#/components/schemas/Id'
        configurationGeneration:
          $ref: '#/components/schemas/Version'
        kind:
          type: string
          enum:
          - token
          - username_password
          - x509
        publicIdentifier:
          anyOf:
          - type: string
            minLength: 0
            maxLength: 256
          - type: 'null'
        fingerprint:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        material:
          oneOf:
          - type: object
            additionalProperties: false
            properties:
              protectionMode:
                const: verifier
                type: string
              verifier:
                type: string
                minLength: 1
                maxLength: 8192
            required:
            - protectionMode
            - verifier
            description: 带算法标识的不可逆校验材料，算法与参数由已有凭据策略冻结。
          - type: object
            additionalProperties: false
            properties:
              protectionMode:
                const: encrypted
                type: string
              secret:
                type: string
                minLength: 1
                maxLength: 8192
                x-sensitive: true
            required:
            - protectionMode
            - secret
            description: 凭据owner解密得到协议所需材料；仅经受认证且加密的服务传输短暂交付，绝不进入outbox/日志/HTTP公共响应。字节上限8192由服务验证。
          - type: object
            additionalProperties: false
            properties:
              protectionMode:
                const: public_certificate
                type: string
              certificatePem:
                type: string
                minLength: 1
                maxLength: 16384
            required:
            - protectionMode
            - certificatePem
            description: 公开X509材料，不包含私钥。
      required:
      - deviceId
      - credentialId
      - configurationGeneration
      - kind
      - publicIdentifier
      - fingerprint
      - expiresAt
      - material
      description: 受限短时响应，expiresAt<=服务端时间+60秒；租户/设备/代/指纹匹配。仅已登记runtime/provider的机器身份及credential.runtime:resolve scope；普通用户/MCP/CLI拒绝。撤销凭据拒绝，pending仅当已批准generation明确要求active且正在应用时可用。非幂等写，无持久秘密响应收据。
