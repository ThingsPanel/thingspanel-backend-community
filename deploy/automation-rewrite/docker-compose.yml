# Isolated environment for the automation/alarm rewrite (A03).
# Ports are deliberately offset from the shared dev stacks so this stack can
# never talk to, or be mistaken for, another workline's database or broker.
services:
  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/timescaledb:14
    container_name: tp-auto-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: thingspanel2026
      POSTGRES_DB: ThingsPanel
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - tp-auto-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ThingsPanel"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tp-auto-redis
    command: ["redis-server", "--requirepass", "redis"]
    ports:
      - "127.0.0.1:16381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt:
    image: tp-mosquitto:2.1.2-qa
    container_name: tp-auto-mqtt
    ports:
      - "127.0.0.1:11885:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  tp-auto-pgdata:
