# Include inside the existing HTTPS server. Define upstream thingspanel_encore
# for the ONE unified Encore application; do not deploy a second auth app.
# Keep these locations above generic business routing. No request/body tracing.
location ^~ /api/v1/auth/ {
    access_log off;
    proxy_pass http://thingspanel_encore;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
}
location = /api/v1/login {
    access_log off;
    proxy_pass http://thingspanel_encore;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
}
