# Isolated local QA only. Compose publishes this listener on 127.0.0.1:32883.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all
user mosquitto

# When the Linux plugin is available, use the production template and mount it
# read-only at /mosquitto/plugins/libtp-mosquitto-plugin.so.
