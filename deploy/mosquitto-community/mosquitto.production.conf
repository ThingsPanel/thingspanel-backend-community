listener 1883 0.0.0.0
allow_anonymous false
# Bound wire packets before plugin copies; trusted ingress envelopes fit below 2 MiB.
max_packet_size 2097152
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
user mosquitto
plugin /mosquitto/plugins/libtp-mosquitto-plugin.so

# Mosquitto 2.1.2 may lose a pending plugin tick timer on an early socket wake.
# The stock $SYS scheduler supplies an independent <=1s main-loop wake.
sys_interval 1
