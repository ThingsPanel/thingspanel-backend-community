listener 1883 127.0.0.1
allow_anonymous false
plugin /mosquitto/plugins/tp-mosquitto-plugin.so
persistence true
persistence_location /mosquitto/data/
autosave_interval 1
log_dest stdout
log_type all

# Mosquitto 2.1.2 may lose a pending plugin tick timer on an early socket wake.
# The stock $SYS scheduler supplies an independent <=1s main-loop wake.
sys_interval 1
