# Isolated plugin PoC on the host. The separate 2.1.2 no-plugin PoC is on 32883.
listener 32884 127.0.0.1
allow_anonymous false
plugin /tmp/tp-mqtt-20261019/build/tp-mosquitto-next.so
log_dest file /tmp/tp-mqtt-20261019/build/mosquitto-plugin.log
log_type all

# Mosquitto 2.1.2 may lose a pending plugin tick timer on an early socket wake.
# The stock $SYS scheduler supplies an independent <=1s main-loop wake.
sys_interval 1
